name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # xmllint validates the corpus against the RELAX NG schema; trang
      # regenerates the XSD used for Monaco's schema-aware completion.
      - name: Install xmllint and trang
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils trang

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation links
        run: pnpm run check:links

      - name: Check conformance corpus
        run: pnpm run check:corpus

      - name: Run renderer unit tests
        run: pnpm run check:layout

      # Regenerates the XSD on every run, both to catch a schema that trang
      # can no longer convert and to keep the committed files in sync. It's
      # committed twice: public/schema/ is the downloadable copy (same
      # convention as the .rng there), and src/playground/ is a duplicate
      # Vite can actually reach - it won't let src's own build-time `?raw`
      # import into public/, so the playground needs its own copy to import.
      - name: Generate XSD from RELAX NG schema
        run: |
          trang -O xsd public/schema/thaimusicxml-0.1.rng public/schema/thaimusicxml-0.1.xsd
          cp public/schema/thaimusicxml-0.1.xsd src/playground/thaimusicxml-0.1.xsd

      - name: Commit regenerated XSD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate XSD from RNG schema [skip ci]"
          file_pattern: public/schema/thaimusicxml-0.1.xsd src/playground/thaimusicxml-0.1.xsd

      # - name: Build
      #   run: pnpm run build
